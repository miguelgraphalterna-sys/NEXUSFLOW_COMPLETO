version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nexusflow
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: nexusflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://nexusflow:password123@db:5432/nexusflow_db
      JWT_SECRET: dev_secret
      NODE_ENV: development
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
volumes:
  postgres_data: